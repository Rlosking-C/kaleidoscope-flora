pluginManagement {
    repositories {
        // ModDevGradle plugin repository
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    // Auto-downloads a matching JDK toolchain
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'kaleidoscope-flora'
