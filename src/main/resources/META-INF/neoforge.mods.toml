modLoader = "javafml"

loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "kaleidoscope_flora"

version = "${file.jarVersion}"
displayName = "Kaleidoscope Flora"
authors = "Rlosking"

credits = "Programming and design: Rlosking. Art: jiasudu. Creative tab section column designed after Kaleidoscope World Liquor by 111 (MIT); no assets from it are included."

logoFile = "logo.png"
description = '''
Brew vanilla flowers into signature teas, each with its own dedicated
effects. An addon for Kaleidoscope Cookery.
'''

[[dependencies.kaleidoscope_flora]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1.0,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.kaleidoscope_flora]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.kaleidoscope_flora]]
    modId = "kaleidoscope_cookery"
    type = "required"
    versionRange = "[1.5.0,1.7)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.kaleidoscope_flora]]
    modId = "patchouli"
    type = "optional"
    versionRange = "[1.21.1-93,)"
    ordering = "NONE"
    side = "BOTH"

[[mixins]]
config = "kaleidoscope_flora.mixins.json"

[modproperties.kaleidoscope_flora]
"yumi:entrypoints" = { "lambdynlights:initializer" = "com.rlosking.flora.client.FloraDynamicLightsInitializer" }

[[dependencies.kaleidoscope_flora]]
modId = "vanillabackport"
type = "optional"
versionRange = "[1.1.7,)"
ordering = "NONE"
side = "BOTH"
